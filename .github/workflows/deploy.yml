name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: aurea-vite-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The repository is currently also configured for legacy branch-based Pages.
      # Wait for that automatic Jekyll deployment to finish so it cannot overwrite
      # the Vite build and leave a blank page (index.html references /src/main.tsx).
      - name: Wait for competing legacy Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            response=$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/$REPOSITORY/actions/runs?head_sha=$HEAD_SHA&per_page=50")
            legacy=$(echo "$response" | jq -r '[.workflow_runs[] | select(.path == "dynamic/pages/pages-build-deployment")] | first | .status // "missing"')
            echo "Legacy Pages deployment: $legacy"
            if [ "$legacy" = "completed" ]; then
              sleep 5
              exit 0
            fi
            if [ "$legacy" = "missing" ] && [ "$i" -ge 12 ]; then
              echo "No legacy workflow found; custom Vite deployment proceeds."
              exit 0
            fi
            sleep 5
          done
          echo "Legacy workflow polling timed out; proceeding with custom deployment."
      # GitHub Pages can retain a stale in-progress deployment after a successful
      # run. Clear the exact older deployment reported by the Pages API. This is
      # safe to repeat: 404 means there is nothing left to cancel.
      - name: Clear previously stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          status=$(curl -sSL -o /tmp/pages-cancel-response -w '%{http_code}' \\
            -X POST \\
            -H "Accept: application/vnd.github+json" \\
            -H "Authorization: Bearer $GH_TOKEN" \\
            -H "X-GitHub-Api-Version: 2022-11-28" \\
            "https://api.github.com/repos/$REPOSITORY/pages/deployments/6c2672bb7da15ab186f1167e364d3ddc337ec8f4/cancel")
          echo "Previous Pages deployment cancel status: $status"
          if [ "$status" != 204 ] && [ "$status" != 404 ] && [ "$status" != 409 ]; then
            cat /tmp/pages-cancel-response
            echo "Could not clear earlier Pages deployment; proceeding to attempt publication."
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
